<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linklog</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 300px; background: var(--background); }
      .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .rows .row { padding: 10px 16px; align-items: center; }
      .actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--sidebar); }
      .actions button { flex: 1; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg></span>
        Linklog
      </div>
      <span class="muted small" id="version"></span>
    </div>
    <div class="rows">
      <div class="row"><span class="grow">Linklog pages</span><span class="badge" id="pages">—</span></div>
      <div class="row"><span class="grow">Page content</span><span class="badge" id="content">—</span></div>
      <div class="row"><span class="grow">Session cache</span><span class="muted small" id="cache">—</span></div>
    </div>
    <div class="actions">
      <button class="outline" id="permissions" type="button">Permissions</button>
      <button class="primary" id="open" type="button">Open Linklog</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
