name: Deploy production

# Every push to main deploys https://linklog.facundopri.com (wrangler.jsonc → env.production)
# after typecheck and tests pass. A manual run redeploys the selected ref.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one at a time in push order; never cancel one mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://linklog.facundopri.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      # D1 Time Travel restores to this bookmark if a migration goes wrong:
      # wrangler d1 time-travel restore linklog-production --bookmark <bookmark> --env production
      - name: Record pre-migration bookmark
        run: bunx wrangler d1 time-travel info linklog-production --env production
      - name: Apply migrations
        run: bunx wrangler d1 migrations apply DB --remote --env production
      # Tag ties the live version to code (wrangler deployments list --env production).
      - name: Deploy
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          bunx wrangler deploy --env production \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(printf '%s' "$MESSAGE" | head -n 1)"
