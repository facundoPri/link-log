name: Deploy landing

# Every push to main that changes the landing page deploys it to the linklog-landing Worker
# (apps/landing/wrangler.jsonc), separate from the app. A manual run redeploys the selected ref.
on:
  push:
    branches: [main]
    paths:
      - apps/landing/**
      - bun.lock
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'
  # Canonical URL, og:url and og:image. Set the LANDING_SITE repository variable when the
  # landing moves to its own domain.
  LANDING_SITE: ${{ vars.LANDING_SITE || 'https://linklog-landing.facundo-prieto321.workers.dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.LANDING_SITE || 'https://linklog-landing.facundo-prieto321.workers.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run landing:build
      # Tag ties the live version to code (wrangler deployments list --name linklog-landing).
      - name: Deploy
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          bunx wrangler deploy --config apps/landing/wrangler.jsonc \
            --tag "$(git rev-parse --short HEAD)" \
            --message "$(printf '%s' "$MESSAGE" | head -n 1)"
