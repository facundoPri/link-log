name: Extension release

# Push a tag `extension-v<version>` (matching apps/extension/package.json) to publish the
# packaged extension as a GitHub release. A manual run only builds the zip as a run artifact.
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Deployed Linklog origins the bridge should reach besides localhost/127.0.0.1,
      # comma-separated (repository variable; empty builds a local-only extension).
      LINKLOG_ORIGINS: ${{ vars.EXTENSION_ORIGINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check
        run: |
          bunx tsc --noEmit -p packages/browser-protocol
          bunx tsc --noEmit -p apps/extension
          bun test apps/extension packages/browser-protocol
      - id: version
        name: Match tag and version
        run: |
          version=$(bun -e 'console.log((await Bun.file("apps/extension/package.json").json()).version)')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "extension-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun run extension:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linklog-extension-${{ steps.version.outputs.version }}
          path: apps/extension/linklog-extension-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          origins=$(jq -r '.content_scripts[0].matches | join(", ")' apps/extension/dist/manifest.json)
          cat > notes.md <<EOF
          Linklog Chrome extension $VERSION (unpacked build, not on the Chrome Web Store).

          Connects to Linklog on: \`$origins\` (pages marked as Linklog only).

          ## Install
          1. Download \`linklog-extension-$VERSION.zip\` below and unzip it into a folder you'll keep.
          2. Open \`chrome://extensions\` and turn on **Developer mode** (top right).
          3. Click **Load unpacked** and choose the unzipped folder.
          4. Open Linklog and go to **Browser**; grant page access from the extension's Connect page for lenses and previews.

          To update: unzip the new version over the same folder and click ↻ on the Linklog card in \`chrome://extensions\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "apps/extension/linklog-extension-$VERSION.zip" \
            --title "Linklog extension $VERSION" --notes-file notes.md
