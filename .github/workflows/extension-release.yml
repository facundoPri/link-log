name: Extension release

# A push to main that changes the extension (or the protocol bundled into it) publishes
# apps/extension/package.json's version as release extension-v<version>, once: a version that
# already has a release is left alone. check.yml makes every such PR raise the version.
# A manual run on main publishes the same way (e.g. to retry); on another ref it only builds
# the zip as a run artifact.
on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/browser-protocol/**"
  workflow_dispatch:

# Two quick merges must not race to create the same release.
concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Deployed Linklog origins the bridge should reach besides localhost/127.0.0.1,
      # comma-separated (repository variable; empty builds a local-only extension).
      LINKLOG_ORIGINS: ${{ vars.EXTENSION_ORIGINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check
        run: |
          bunx tsc --noEmit -p packages/browser-protocol
          bunx tsc --noEmit -p apps/extension
          bun test apps/extension packages/browser-protocol
      - id: version
        name: Version and whether it is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("apps/extension/package.json").json()).version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/extension-v$version" 2>&1); then
            echo "extension-v$version is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "HTTP 404" <<<"$out"; then
            echo "Could not look up release extension-v$version: $out" >&2
            exit 1
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/extension-v$version" >/dev/null 2>&1; then
            echo "Tag extension-v$version exists without a release; its commit may differ from this one. Publish or delete it by hand." >&2
            exit 1
          else
            echo "publish=${{ github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
          fi
      - run: bun run extension:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linklog-extension-${{ steps.version.outputs.version }}
          path: apps/extension/linklog-extension-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          origins=$(jq -r '.content_scripts[0].matches | join(", ")' apps/extension/dist/manifest.json)
          cat > notes.md <<EOF
          Linklog Chrome extension $VERSION (unpacked build, not on the Chrome Web Store).

          Connects to Linklog on: \`$origins\` (pages marked as Linklog only).

          ## Install
          1. Download \`linklog-extension-$VERSION.zip\` below and unzip it into a folder you'll keep.
          2. Open \`chrome://extensions\` and turn on **Developer mode** (top right).
          3. Click **Load unpacked** and choose the unzipped folder.
          4. Open Linklog and go to **Browser**; grant page access from the extension's Connect page for lenses and previews.

          To update: unzip the new version over the same folder and click ↻ on the Linklog card in \`chrome://extensions\`.
          EOF
          gh release create "extension-v$VERSION" "apps/extension/linklog-extension-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Linklog extension $VERSION" --notes-file notes.md
